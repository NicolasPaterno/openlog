services:
  postgres:
    image: postgres:16-alpine
    container_name: openlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openlog_secret}
      POSTGRES_DB: ${POSTGRES_DB:-openlog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openlog}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: openlog-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-openlog}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-openlog_secret}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: openlog-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-openlog_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-openlog_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    container_name: openlog-migrate
    command: ["--wait", "--no-dump-schema", "up"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-openlog}:${POSTGRES_PASSWORD:-openlog_secret}@postgres:5432/${POSTGRES_DB:-openlog}?sslmode=disable"
    volumes:
      - ./migrations/sql:/db/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: openlog-ingestion
    restart: unless-stopped
    environment:
      PORT: ${INGESTION_PORT:-8080}
      DATABASE_URL: "postgres://${POSTGRES_USER:-openlog}:${POSTGRES_PASSWORD:-openlog_secret}@postgres:5432/${POSTGRES_DB:-openlog}?sslmode=disable"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-openlog}:${RABBITMQ_PASSWORD:-openlog_secret}@rabbitmq:5672/"
    ports:
      - "${INGESTION_PORT:-8080}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: openlog-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend

  ai-worker:
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile
    container_name: openlog-ai-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-openlog}:${POSTGRES_PASSWORD:-openlog_secret}@postgres:5432/${POSTGRES_DB:-openlog}?sslmode=disable"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-openlog}:${RABBITMQ_PASSWORD:-openlog_secret}@rabbitmq:5672/"
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      OLLAMA_BASE_URL: http://ollama:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  ollama_data:

networks:
  backend:
    driver: bridge
